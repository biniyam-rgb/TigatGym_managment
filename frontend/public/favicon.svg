<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tigatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Tigat Gym Orange Brand Badge -->
  <rect width="48" height="48" rx="11" fill="url(#tigatGrad)" />
  <!-- Crisp White Dumbbell / Barbell Emblem -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Center Bar -->
    <line x1="15" y1="24" x2="33" y2="24" />
    <!-- Left Inner Weight Plate -->
    <line x1="15" y1="12" x2="15" y2="36" />
    <!-- Left Outer Weight Plate -->
    <line x1="9" y1="16" x2="9" y2="32" />
    <!-- Right Inner Weight Plate -->
    <line x1="33" y1="12" x2="33" y2="36" />
    <!-- Right Outer Weight Plate -->
    <line x1="39" y1="16" x2="39" y2="32" />
  </g>
</svg>
